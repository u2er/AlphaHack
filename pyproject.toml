[project]
name = "eventgraph"
version = "0.1.0"
description = "Новостная аналитика для руководителей крупного бизнеса в интернет-банке «Альфа-Бизнес»"
readme = "README.md"
# Та же версия, что в образе (Dockerfile: python:3.12-slim).
requires-python = ">=3.12,<3.13"
# Зеркало requirements.txt: точные версии — те же, диапазоны фиксирует poetry.lock.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings>=2.14,<3",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "pgvector==0.5.1",
    "httpx==0.28.1",
    "cryptography==50.0.2",
    "tzdata==2026.5",
    "python-multipart==0.0.20",
    "openai==2.39.0",
    "pillow==11.1.0",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "feedparser==6.0.14",
    "trafilatura==2.3.1",
    "pypdf==5.1.0",
    "h2==4.1.0",
    "fastembed==0.9.0",
    "numpy==2.5.4",
    "psycopg[binary]==3.2.3",
    "python-dotenv==1.2.4",
    "docling>=2.110,<3",
    "tesserocr>=2.8",
    "transformers>=4.46,<5",
    "pypdfium2==4.30.0",
    # Трассировка LLM в Langfuse (utils/tracing.py); без ключей LANGFUSE_* не включается.
    "langfuse==4.17.0",
    # CPU-сборки, как в Dockerfile; источник — pytorch-cpu ниже.
    "torch",
    "torchvision",
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
torch = { source = "pytorch-cpu" }
torchvision = { source = "pytorch-cpu" }

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.4"
pytest-asyncio = "0.25.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
