services:
  api:
    build: .
    pull_policy: build
    container_name: eventgraph
    restart: unless-stopped
    command: ["./entrypoint.sh", "api"]
    user: "${EVENTGRAPH_UID:-1000}:${EVENTGRAPH_GID:-1000}"
    env_file:
      - .env
    environment: &env
      DATABASE_URL: postgresql+asyncpg://eventgraph:${DB_PASSWORD:-eventgraph}@db:5432/eventgraph
      DATA_DIR: /data
      # Модели docling (~1 ГБ) качаются один раз и живут в томе данных.
      HF_HOME: /data/hf
      # Экспорты мастера профиля: GUI кладёт сюда, воркер загружает.
      PROFILES_DIR: /profiles
      LLM_API_KEY: ${LLM_API_KEY:-}
      # Интернет-поиск агентов (web_search): SEARXNG_URL= в .env — выключить.
      SEARXNG_URL: ${SEARXNG_URL-http://searxng:8080}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # Картинки записей; API отдаёт их по /items/{uid}/images/{n}.
      - data:/data
      - profiles:/profiles
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    pull_policy: build
    container_name: eventgraph-worker
    restart: unless-stopped
    command: ["./entrypoint.sh", "worker"]
    user: "${EVENTGRAPH_UID:-1000}:${EVENTGRAPH_GID:-1000}"
    env_file:
      - .env
    environment: *env
    volumes:
      - data:/data
      - ./pdfs:/data/pdfs
      - profiles:/profiles
    depends_on:
      db:
        condition: service_healthy

  profile-gui:
    build: .
    pull_policy: build
    container_name: eventgraph-profile-gui
    restart: unless-stopped
    command: ["./entrypoint.sh", "profile-gui"]
    user: "${EVENTGRAPH_UID:-1000}:${EVENTGRAPH_GID:-1000}"
    env_file:
      - .env
    environment:
      <<: *env
      GUI_RUNS_DIR: /data/gui-runs
      EVENTGRAPH_URL: http://api:8000
    ports:
      - "${PROFILE_GUI_PORT:-8765}:8765"
    volumes:
      - data:/data
      - profiles:/profiles
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  profile-prepare:
    build: .
    pull_policy: build
    profiles: ["setup"]
    command: ["./entrypoint.sh", "profile-prepare"]
    user: "${EVENTGRAPH_UID:-1000}:${EVENTGRAPH_GID:-1000}"
    env_file:
      - .env
    environment: *env
    volumes:
      - data:/data
    depends_on:
      db:
        condition: service_healthy

  searxng:
    image: docker.io/searxng/searxng:2026.10.19-81371861f
    container_name: eventgraph-searxng
    restart: unless-stopped
    environment:
      # Ключ подписи куки и прокси картинок; задайте свой случайный в .env.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-eventgraph-searxng-change-me}
    ports:
      - "${SEARXNG_PORT:-8082}:8080"
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng

  db:
    image: pgvector/pgvector:pg16
    container_name: eventgraph-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventgraph
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eventgraph}
      POSTGRES_DB: eventgraph
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventgraph -d eventgraph"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  data:
  pg:
  profiles:
  searxng-cache:
